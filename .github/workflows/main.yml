name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never sign in CI: project.yml hardcodes the author's development team,
  # which doesn't exist here. The IPA is signed later by whatever sideloads it.
  NO_SIGNING: CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM=

jobs:
  test:
    name: Build and test (simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      print(d["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Podium.xcodeproj \
            -scheme Podium \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            $NO_SIGNING

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore

  ipa:
    name: Unsigned IPA (device)
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write # only used to attach the IPA to a release on v* tags
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iPhone (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Podium.xcodeproj \
            -scheme Podium \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            $NO_SIGNING

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Podium.app"
          test -d "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry Podium-unsigned.ipa Payload)
          ls -lh dist/Podium-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Podium-unsigned-ipa
          path: dist/Podium-unsigned.ipa

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Podium-unsigned.ipa
